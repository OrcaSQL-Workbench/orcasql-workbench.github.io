name: Publish website
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} | Validate | Website + Docs', github.event.pull_request.number)
      || github.event_name == 'push'
      && format('Publish Website | {0}', github.event.head_commit.message || github.sha)
      || github.ref == 'refs/heads/main'
      && format('Manual | Publish Website | {0}', github.ref_name)
      || format('Manual | Validate | Website + Docs | {0}', github.ref_name) }}

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "privacy/**"
      - "tests/**"
      - "scripts/build_docs.py"
      - "scripts/build_privacy.py"
      - "scripts/validate_site.py"
      - "scripts/workflow_source.py"
      - "requirements-docs.txt"
      - ".gitattributes"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "privacy/**"
      - "tests/**"
      - "scripts/build_docs.py"
      - "scripts/build_privacy.py"
      - "scripts/validate_site.py"
      - "scripts/workflow_source.py"
      - "requirements-docs.txt"
      - ".gitattributes"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  source:
    name: Resolve run source | Website
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      label: ${{ steps.source.outputs.label }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Associate the run with its PR or commit
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/workflow_source.py

  validate:
    name: >-
      ${{ github.event_name == 'pull_request'
          && 'Validate Website + Docs'
          || github.ref != 'refs/heads/main'
          && format('{0} | Validate Website + Docs', needs.source.outputs.label)
          || format('{0} | Pre-publish Check', needs.source.outputs.label) }}
    needs: source
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful source resolution
        if: always() && needs.source.result != 'success'
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          echo "::error::Run source resolution did not succeed ($SOURCE_RESULT)."
          exit 1
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-docs.txt
      - name: Test documentation and policy publishing
        run: python -m unittest discover -s tests -v
      - name: Check policy exports and complete first-parent archive history
        env:
          ARCHIVE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          if [ -n "$ARCHIVE_BASE" ] && [ "$ARCHIVE_BASE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/build_privacy.py --check --archive-base "$ARCHIVE_BASE"
          else
            python scripts/build_privacy.py --check --archive-base HEAD
          fi
      - name: Build documentation from Markdown
        working-directory: scripts
        run: python build_docs.py
      - name: Validate static pages
        working-directory: scripts
        run: python validate_site.py
      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    name: ${{ needs.source.outputs.label }} | Publish Website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [source, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
