<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>页面不存在 · OrcaSQL Workbench</title>
  <script src="/assets/theme.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main class="error-main wrap">
    <h1>页面不存在</h1>
    <p>该地址没有可访问的页面，请返回首页查看文档与反馈入口。</p>
    <a class="button button-primary" href="/">返回首页</a>
    <div class="theme-settings" data-theme-settings hidden>
      <label>主题
        <select data-theme-control>
          <option value="system">跟随系统</option>
          <option value="light">浅色</option>
          <option value="dark">深色</option>
        </select>
      </label>
      <span class="theme-status" data-theme-status role="status" hidden>当前页面已切换，但浏览器未能保存主题。</span>
    </div>
  </main>
</body>
</html>
